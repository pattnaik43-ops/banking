<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SBI Operations Gateway</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--plum:#22093a;--plum2:#4a1a63;--cream:#fff6e4;--gold:#ffc65c;--rose:#ff6fa5;--teal:#2fb9a6;--ink:#3a1d4d;--mute:#7b6390}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);overflow-x:hidden}
body{display:grid;place-items:center;align-items:safe center;overflow-y:auto;position:relative;background:radial-gradient(ellipse 90% 50% at 50% 108%,#ff6fa577,transparent 70%),radial-gradient(ellipse 60% 40% at 20% 10%,#8a4ad055,transparent 65%),linear-gradient(#1a0730,var(--plum2))}
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sky .st{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.2;transform:scale(1.8)}}
.bl{position:absolute;bottom:-90px;width:36px;height:46px;border-radius:50% 50% 48% 48%;opacity:.85;animation:rise linear infinite}
.bl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:46px;background:#ffffff66}
.bl::before{content:"";position:absolute;left:22%;top:16%;width:20%;height:26%;border-radius:50%;background:#ffffff66}
@keyframes rise{to{transform:translateY(-120vh) translateX(24px)}}
.bunting{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;z-index:3;pointer-events:none;border-top:3px solid #ffffff44}
.bunting i{flex:1;max-width:60px;height:38px;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.card-wrap{position:relative;width:90%;max-width:390px;z-index:2;margin:64px 0 28px}
.card{position:relative;background:var(--cream);border-radius:26px;padding:2.4rem 1.8rem 1.6rem;text-align:center;border:3px solid var(--gold);box-shadow:0 0 0 6px #ffc65c33,0 30px 60px -18px #000a;animation:pop .8s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.94)}}
.emblem{width:62px;height:62px;margin:-64px auto 12px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--rose));border:4px solid var(--cream);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;color:var(--plum);box-shadow:0 8px 20px #0006;letter-spacing:.03em}
.eyebrow{font-weight:700;font-size:.8rem;color:var(--mute);margin-bottom:2px}
h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:2.7rem;line-height:1.1;color:var(--plum2);margin-bottom:6px}
#dynamic-wish{font-size:.92rem;font-weight:600;color:var(--rose);min-height:22px;margin-bottom:1.3rem;transition:opacity .5s ease}
.btn-group{display:flex;flex-direction:column;gap:11px;text-align:left}
.nav-btn{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:16px;background:#fff;border:2px solid #f0e2c4;color:var(--ink);text-decoration:none;cursor:pointer;position:relative;box-shadow:0 4px 0 #f0e2c4;transition:transform .2s,box-shadow .2s,border-color .2s}
.nav-btn:hover{transform:translateY(-2px);border-color:var(--teal);box-shadow:0 6px 0 #bfe9e2}
.nav-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #f0e2c4}
.btn-index{width:38px;height:38px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:#fff;background:var(--teal)}
.btn-report .btn-index{background:#8a4ad0}
.btn-text{flex:1;min-width:0}
.btn-label{display:block;font-size:1rem;font-weight:800}
.btn-sub{display:block;font-size:.8rem;color:var(--mute);margin-top:1px}
.btn-arrow{font-size:1.2rem;color:var(--mute);transition:transform .2s}
.nav-btn:hover .btn-arrow{transform:translateX(4px)}
/* surprise button with a tiny party inside */
@keyframes shim{to{background-position:-200% 0}}
@keyframes fall{to{transform:translateY(90px) rotate(540deg);opacity:0}}
@keyframes up{to{transform:translateY(-95px) translateX(10px);opacity:0}}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-6px) rotate(8deg) scale(1.15)}}
@keyframes glowp{50%{box-shadow:0 4px 0 #d9477f,0 0 26px #ff6fa5aa}}
.surprise{overflow:hidden;margin-top:4px;border:2px solid #fff;background:linear-gradient(90deg,var(--rose),var(--gold),var(--rose));background-size:200% 100%;animation:shim 3s linear infinite,glowp 2s ease-in-out infinite;box-shadow:0 4px 0 #d9477f}
.surprise:hover{border-color:#fff;box-shadow:0 6px 0 #d9477f}
.surprise .btn-label{color:var(--plum)}
.surprise .btn-sub{color:#5a2a6a;font-weight:700}
.surprise .btn-index{background:#ffffffcc;font-size:1.4rem;animation:hop 1.1s ease-in-out infinite}
.surprise .btn-arrow{color:var(--plum);font-size:1.4rem;animation:hop 1.1s .3s ease-in-out infinite}
.surprise>:not(.party){position:relative}
.party{position:absolute;inset:0;pointer-events:none}
.party i{position:absolute;top:-10px;left:var(--x);width:6px;height:10px;background:var(--c);border-radius:1px;animation:fall 2.6s linear infinite var(--d)}
.party b{position:absolute;bottom:-22px;left:var(--x);font-size:1.05rem;animation:up 4s ease-in infinite var(--d)}
.footer-text{margin-top:1.4rem;font-size:.72rem;font-weight:600;color:var(--mute)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="bunting" id="bunting"></div>
<canvas id="fx"></canvas>
<div class="card-wrap">
<div class="card">
<div class="emblem">SBI</div>
<div class="eyebrow">Welcome back</div>
<h1>Operations Gateway</h1>
<p id="dynamic-wish">Loading workspace...</p>
<div class="btn-group">
<a href="K1.html" class="nav-btn btn-target"><span class="btn-index">01</span><span class="btn-text"><span class="btn-label">Target Portal</span><span class="btn-sub">Elipoma</span></span><span class="btn-arrow">→</span></a>
<a href="A1.html" class="nav-btn btn-report"><span class="btn-index">02</span><span class="btn-text"><span class="btn-label">Daily Report</span><span class="btn-sub">Ashutosh</span></span><span class="btn-arrow">→</span></a>
<a href="surprise.html" class="nav-btn surprise" id="surprise" aria-label="A surprise is waiting. Tap to open.">
<span class="party" id="party"></span>
<span class="btn-index">🎁</span>
<span class="btn-text"><span class="btn-label">A Surprise Is Waiting</span><span class="btn-sub">Tap to open</span></span>
<span class="btn-arrow">🎉</span>
</a>
</div>
<p class="footer-text">&#128274; Secure branch access &copy; 2026</p>
</div>
</div>
<script>
const wishes=["Have a fantastic day ahead","Keep up the brilliant work","Stay safe and productive","Let's crush our targets today","Welcome back to the dashboard","Wishing you massive success","Your hard work is appreciated"];
window.onload=()=>{const w=document.getElementById('dynamic-wish');w.style.opacity=0;setTimeout(()=>{w.textContent=wishes[Math.floor(Math.random()*wishes.length)];w.style.opacity=1},300)};
const cols=['#ffc65c','#ff6fa5','#2fb9a6','#8a4ad0','#fff'],R=Math.random;
/* sky: stars, balloons, bunting */
const sky=document.getElementById('sky');
for(let i=0;i<40;i++)sky.insertAdjacentHTML('beforeend',`<span class="st" style="left:${R()*100}%;top:${R()*70}%;animation-delay:${R()*3}s"></span>`);
for(let i=0;i<9;i++)sky.insertAdjacentHTML('beforeend',`<span class="bl" style="left:${R()*94}%;background:${cols[i%4]};animation-duration:${14+R()*14}s;animation-delay:${-R()*20}s;transform:scale(${.7+R()*.7})"></span>`);
const bt=document.getElementById('bunting');for(let i=0;i<14;i++)bt.insertAdjacentHTML('beforeend',`<i style="background:${cols[i%4]};animation-delay:${i*.15}s"></i>`);
/* party inside the button */
const P=document.getElementById('party');
for(let i=0;i<14;i++)P.insertAdjacentHTML('beforeend',`<i style="--x:${R()*96}%;--d:${(R()*2.6).toFixed(2)}s;--c:${['#fff','#3a1d4d','#2fb9a6','#8a4ad0','#fff6e4'][i%5]}"></i>`);
for(let k=0;k<4;k++)P.insertAdjacentHTML('beforeend',`<b style="--x:${12+k*24}%;--d:${k*1.1}s">🎈</b>`);
/* confetti burst on tap, then open the surprise */
const cv=document.getElementById('fx'),cx=cv.getContext('2d');
document.getElementById('surprise').addEventListener('click',e=>{
 e.preventDefault();const href=e.currentTarget.href;
 if(matchMedia('(prefers-reduced-motion:reduce)').matches){location.href=href;return}
 cv.width=innerWidth;cv.height=innerHeight;const r=e.currentTarget.getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top+r.height/2;
 const ps=Array.from({length:170},()=>{const a=R()*Math.PI*2,s=4+R()*9;return{x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,w:5+R()*5,c:cols[Math.floor(R()*5)],r:R()*6}});
 let t=0;(function f(){cx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.985;p.r+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);cx.restore()});if(++t<80)requestAnimationFrame(f)})();
 setTimeout(()=>location.href=href,1300);
});
</script>
</body>
</html>
